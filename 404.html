<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Page not found." />
    <title>404 - not found</title>
    <style>
      html {
        overflow: hidden;
        background: #222;
      }
      html, body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 30vh;
        box-sizing: border-box;
        text-align: center;
        transform: rotate(-5deg) scale(1.25);
        box-shadow: 0 0 80px rgba(0,0,0,0.8);
        background:
          linear-gradient(176deg, transparent 55%, rgba(0,0,0,0.6) 62%, rgba(0,0,0,0.85) 100%),
          radial-gradient(ellipse at 50% 35%, #888 0%, #555 50%, #333 100%);
        color: #6e0b0b;
      }
      @media (prefers-color-scheme: dark) {
        html { background: #000; }
        body {
          background:
            linear-gradient(176deg, transparent 55%, rgba(0,0,0,0.85) 62%, rgba(0,0,0,1) 100%),
            radial-gradient(ellipse at 50% 35%, #1a1a1a 0%, #080808 50%, #000 100%);
          color: #a80a0a;
        }
        main p { color: #551010; }
      }
      @keyframes changecolor {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0.1;
          transform: scale(0.6);
        }
      }
      main {
        animation: changecolor 90s infinite alternate;
      }
      @font-face {
        font-family: "TinyHand";
        src: url("/font/BFTinyHand-Regular.otf") format("opentype");
        font-display: swap;
      }
      main h1 {
        font-family: "TinyHand";
        font-size: inherit;
        font-weight: normal;
        margin: 0;
      }
      main p {
        font-family: monospace;
        font-size: small;
        color: #551010;
      }
      .blood-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }
      .blood-drop {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #8b0000;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        box-shadow: 0 0 3px rgba(139, 0, 0, 0.8);
      }
      .blood-drop::after {
        content: '';
        position: absolute;
        width: 2px;
        height: 20px;
        background: linear-gradient(to bottom, #8b0000, transparent);
        top: -20px;
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
        opacity: 0.6;
      }
      .blood-drop:nth-child(1) { left: 5%; animation: drip 8s ease-in infinite; animation-delay: 0s; }
      .blood-drop:nth-child(2) { left: 12%; animation: drip 8.8s ease-in infinite; animation-delay: 2s; width: 6px; height: 6px; }
      .blood-drop:nth-child(3) { left: 22%; animation: drip 12s ease-in infinite; animation-delay: 4.8s; width: 10px; height: 10px; }
      .blood-drop:nth-child(4) { left: 32%; animation: drip 12.8s ease-in infinite; animation-delay: 3.2s; }
      .blood-drop:nth-child(5) { left: 42%; animation: drip 18s ease-in infinite; animation-delay: 7.2s; width: 7px; height: 7px; }
      .blood-drop:nth-child(6) { left: 50%; animation: drip 22s ease-in infinite; animation-delay: 1.2s; width: 9px; height: 9px; }
      .blood-drop:nth-child(7) { left: 58%; animation: drip 20s ease-in infinite; animation-delay: 8.4s; }
      .blood-drop:nth-child(8) { left: 68%; animation: drip 13.2s ease-in infinite; animation-delay: 6s; width: 6px; height: 6px; }
      .blood-drop:nth-child(9) { left: 78%; animation: drip 12.4s ease-in infinite; animation-delay: 3.6s; }
      .blood-drop:nth-child(10) { left: 88%; animation: drip 8.4s ease-in infinite; animation-delay: 5.2s; }
      .blood-drop:nth-child(11) { left: 95%; animation: drip 9.2s ease-in infinite; animation-delay: 2.8s; width: 7px; height: 7px; }
      @media (prefers-reduced-motion: reduce) {
        .blood-container { display: none; }
        main { animation: none; }
      }
      @keyframes drip {
        0% { top: -10px; opacity: 0; }
        10% { opacity: 1; }
        80% { opacity: 1; }
        100% { top: 60vh; opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="blood-container" aria-hidden="true">
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
      <div class="blood-drop"></div>
    </div>
    <main>
      <h1>There is really nothing here for you to see.</h1>
      <p><script>document.write(location.href)</script> was not found.</p>
    </main>
  </body>
</html>
